# Neo4j graph database with the Graph Data Science (GDS) plugin.
# Start:  docker compose up -d      Stop:  docker compose down
services:
  neo4j:
    image: neo4j:5.26
    container_name: fraud-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (web page)
      - "7687:7687"   # Bolt port (Python connects here)
    environment:
      NEO4J_AUTH: neo4j/fraudgraph2026
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
